<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAWL ARENA - 大乱闘バトルアリーナ</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b14; color: #fff;
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000;
    image-rendering: auto;
    box-shadow: 0 0 60px rgba(0,0,0,.8);
    max-width: 100vw; max-height: 100vh;
    aspect-ratio: 16 / 9;
  }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 6px;
    text-align: center; font-size: 12px; color: #667;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">1P: WASD 移動 / W・Space ジャンプ / J 攻撃 / K 必殺技 / L シールド　｜　2P: 矢印 移動 / ↑ ジャンプ / , 攻撃 / . 必殺技 / / シールド　｜　ゲームパッド対応</div>
<script src="game.js"></script>
<script>
  // 操作ヒントは最初の入力後にフェードアウト
  const hint = document.getElementById('hint');
  const hideHint = () => { hint.style.transition = 'opacity 1.5s'; hint.style.opacity = '0'; };
  window.addEventListener('keydown', hideHint, { once: true });
  window.addEventListener('pointerdown', hideHint, { once: true });
</script>
</body>
</html>
